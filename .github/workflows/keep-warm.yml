# Pings the deployed health check so Render's free tier never idles into a
# cold start. GitHub's scheduled runs can be delayed under load, so this is
# best-effort; UptimeRobot is more punctual if you need a hard guarantee.
name: Keep Render service warm

on:
  schedule:
    - cron: "*/5 * * * *" # every 5 minutes
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /healthz
        run: |
          curl -fsS --max-time 60 --retry 2 --retry-delay 10 \
            https://drive-thru-kp8u.onrender.com/healthz
